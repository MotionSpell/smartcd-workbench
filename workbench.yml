port: 3000

avgen:
  # set auto to false when using a custom origin
  auto: true
  uri: http://127.0.0.1:8080/Manifest.mpd
  rdirs: ./tmp/avgen

mabr-server:
  auto: true
  # replace avgen with custom http origin
  origin: avgen
  # route / mABR 
  output: route://234.1.1.1:1234/:ifce=127.0.0.1
  # ms delay before auto start
  delay: 5000

gateway:
  auto: true
  port: 8081
  scfg: ./gateway/dev/dev.scfg
  # ms delay before auto start
  delay: 8000
