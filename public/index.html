<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Workbench</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    button { margin-left: 0.5em; }
  </style>
</head>
<body>
  <div>
    <video id="videoPlayer" controls></video>
  </div>

  <div>
    <label for="videoSource">Video Source:</label>
    <input
      type="text"
      id="videoSource"
      name="videoSource"
      size="32"
      value=""
      readonly/>
    <div><strong>x-from-mabr: </strong><span id="from-mabr"></span></div>
  </div>

  <div>
    <div id="processes" loading="false"></div>
  </div>

  <script src="https://cdn.dashjs.org/latest/modern/umd/dash.all.min.js"></script>

  <script>
    (function () {
      function setProcessesState(data){
        const container = document.getElementById('processes');
        container.innerHTML = '';
        for (const [name, status] of Object.entries(data)) {
          const div = document.createElement('div');
          div.innerHTML = `<b>${name}</b>: ${status}`;
          const actionBtn = document.createElement('button');
          if (status == 'running'){
            actionBtn.textContent = 'Stop';
            actionBtn.onclick = () => fetch('/api/stop/' + name).then(updateSate);
          } else {
            actionBtn.textContent = 'Start';
            actionBtn.onclick = () => fetch('/api/start/' + name).then(updateSate);
          }
          div.appendChild(actionBtn);
          container.appendChild(div);
        }
      }
      
      const getVideoSourceUrl = () => document.getElementById('videoSource').value;
      const setVideoSourceUrl = (value) => {
        if (value != getVideoSourceUrl()){
          player.attachSource(value);
        }
        document.getElementById('videoSource').value = value;
      }

      async function updateSate() {
        const res = await fetch('/api/status');
        const { processes, mabrAvailability } = await res.json();
        setProcessesState(processes);
        
        if (processes['gateway'] == 'running'){
          setVideoSourceUrl("http://127.0.0.1:8081/service1/Manifest.mpd");
        } else if (processes['avgen'] == 'running'){
          setVideoSourceUrl("http://127.0.0.1:8080/Manifest.mpd");
        } else {
          setVideoSourceUrl("http://127.0.0.1:8080/Manifest.mpd");        
        }
      }

      const interceptor = response => {
          const msg = "x-from-mabr" in response.headers ? response.headers["x-from-mabr"] : "undefined";
          if (response.url)
            document.getElementById('from-mabr').innerHTML = `<em>${msg} - ${response.url.split('/').pop()}</em>`;
          return Promise.resolve(response);
      }
      const player = dashjs.MediaPlayer().create();
      player.addResponseInterceptor(interceptor)
      player.initialize(document.querySelector("#videoPlayer"), null, true);
      player.setMute(true);
      
      updateSate();
      setInterval(updateSate, 2000);
    })();
  </script>

</body>
</html>
